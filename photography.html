<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photography - iiSpectre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/Media/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">

  <meta property="og:title" content="Photography - iiSpectre">
  <meta property="og:description" content="website">
  <meta property="og:image" content="https://iispectre.com/Media/favicon.png">
  <meta property="og:url" content="https://iispectre.com/photography">

<body>

<div id="nav-placeholder"></div>

<div class="container">

  <h1>Photographs</h1>

  <p>Here are some photos I've taken from 2024 - now, hope you enjoy!</p>

  <div class="photography-wrapper">

  <div class="photography">

    <div class="photography-track" id="photographyTrack">

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0318.JPG" alt="IMG 0318">
      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0319.JPG" alt="IMG 0319">

      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0374.JPG" alt="IMG 0374">
      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0378.JPG" alt="IMG 0378">
      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0660.JPG" alt="IMG 0660">
      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0713.JPG" alt="IMG 0713">

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0777.JPG" alt="IMG 0777">

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0815.JPG" alt="IMG 0815">
      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_0998.JPG" alt="IMG 0998">
      </div>

      <div class="photography-slide">
        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_1004.JPG" alt="IMG 1004">

        <img src="https://raw.githubusercontent.com/iiSpectre/ignore/refs/heads/main/IMG_1457.jpg" alt="IMG 1457">
      </div>

    </div>

    <button
      class="photography-arrow left"
      id="photographyPrev"
      aria-label="Previous photograph"
      type="button">
      ‹
    </button>

    <button
      class="photography-arrow right"
      id="photographyNext"
      aria-label="Next photograph"
      type="button">
      ›
    </button>

    <div
      class="photography-dots"
      id="photographyDots"
      aria-label="Photography navigation">
    </div>

  </div>

</div>

</div>
